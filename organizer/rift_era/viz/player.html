<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>裂陆纪元 · 回放播放器</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --panel2:#edf1f5; --border:#d5dde4; --text:#16242b;
    --muted:#5e737e; --accent:#0b7da1; --grid:#dfe7ec; --marker:#16242b99;
    --ocean:#b8d4e8; --plain:#d9e2c3; --hill:#d4c89e; --forest:#b4cfa8; --desert:#e6d5a9; --mountain:#bfc3c7;
    --war:#d93b3b; --good:#1d8a5e; --warn:#c97b16; --city:#d49b24;
  }
  :root[data-theme="dark"]{
    --bg:#0f1519; --panel:#172026; --panel2:#212d35; --border:#31414b; --text:#e2edf2;
    --muted:#94a8b3; --accent:#44c3db; --grid:#2a3841; --marker:#e2edf299;
    --ocean:#12293d; --plain:#273629; --hill:#3a3525; --forest:#1d3427; --desert:#423926; --mountain:#3b4147;
    --war:#f05a5a; --good:#3ec28a; --warn:#e8a43e; --city:#e5b94c;
  }
  *{box-sizing:border-box;letter-spacing:0}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  button,input,select{font:inherit}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #wrap{max-width:1680px;margin:0 auto;padding:16px 20px 128px}
  header#top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:16px}
  h1{font-size:19px;margin:0;white-space:nowrap}
  .tag{font-size:11px;color:var(--muted);font-family:ui-monospace,Consolas,monospace;background:var(--panel2);padding:3px 7px;border-radius:4px;border:1px solid var(--border)}
  .tag.hi{color:var(--text);font-weight:600}
  #theme{margin-left:auto}
  button,select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:5px 10px;min-height:32px;cursor:pointer;font-size:12px}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  :root[data-theme="dark"] button.on{color:#0f1519;font-weight:600}

  #drop{border:2px dashed var(--border);border-radius:6px;padding:48px 20px;text-align:center;color:var(--muted);background:var(--panel);margin-top:8px}
  #drop.hot{border-color:var(--accent);color:var(--text);background:var(--panel2)}
  #loadbox{margin:10px 0 0;font-size:12px;color:var(--muted)}
  #err{color:var(--war);white-space:pre-wrap;font-size:12px;margin-top:8px}

  main{display:grid;grid-template-columns:minmax(420px,560px) minmax(0,1fr);gap:18px;align-items:start}
  .col{display:flex;flex-direction:column;gap:14px;min-width:0}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:12px;min-width:0}
  .card-hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
  .card h2{font-size:14px;margin:0;display:flex;align-items:center;gap:8px}
  .sub{font-size:11px;color:var(--muted)}

  .map-wrap{position:relative;width:100%;aspect-ratio:1;border:1px solid var(--border);border-radius:4px;overflow:hidden;background:var(--ocean)}
  #cvMap{width:100%;height:100%;display:block;cursor:crosshair}
  .toggles{display:flex;flex-wrap:wrap;gap:5px}
  .toggles button{min-height:26px;padding:2px 8px;font-size:11px}
  .map-legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:11px;color:var(--muted);align-items:center}
  .map-legend span{display:inline-flex;align-items:center;gap:4px}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px}
  #tip{position:fixed;z-index:50;pointer-events:none;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:7px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.22);max-width:260px;line-height:1.4}

  .tbl-wrap{overflow-x:auto}
  table.lb{width:100%;border-collapse:collapse;font-size:12px}
  table.lb th{text-align:right;font-weight:600;color:var(--muted);font-size:11px;padding:5px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
  table.lb th:nth-child(1),table.lb th:nth-child(2){text-align:left}
  table.lb td{padding:6px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
  table.lb td:nth-child(1),table.lb td:nth-child(2){text-align:left;font-family:inherit}
  table.lb tbody tr{cursor:pointer;transition:background .12s}
  table.lb tbody tr:hover{background:var(--panel2)}
  table.lb tbody tr.sel{background:var(--panel2);outline:1px solid var(--accent)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  .lbl{font-weight:600}
  .botname{color:var(--muted);font-size:11px;margin-left:4px}
  .war-badge{color:var(--war);font-size:11px;margin-left:4px;font-weight:700}
  .fault-bad{color:var(--war);font-weight:700}

  .pillars-box{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:11px}
  .pbar{display:flex;align-items:center;gap:6px;flex:1;min-width:140px}
  .pbar-track{position:relative;flex:1;height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .pbar-fill{position:absolute;top:0;bottom:0;border-radius:4px}
  .pbar-zero{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--muted);opacity:.65}
  .pbar-neg-val{color:var(--war);font-weight:600}

  .chart-tabs{display:flex;flex-wrap:wrap;gap:5px}
  .chart-tabs button{min-height:26px;padding:2px 8px;font-size:11px}
  #cvChart{width:100%;height:230px;display:block;cursor:pointer}

  .ev-filters{display:flex;flex-wrap:wrap;gap:4px}
  .ev-filters button{min-height:25px;padding:2px 8px;font-size:11px}
  #warsBar{font-size:11px;color:var(--muted);margin-bottom:8px;padding:5px 8px;border-radius:4px;background:var(--panel2)}
  #evList{max-height:260px;overflow-y:auto;font-size:12px}
  .ev-row{display:flex;gap:8px;align-items:baseline;padding:5px 6px;border-bottom:1px dashed var(--border);cursor:pointer;border-radius:3px}
  .ev-row:hover{background:var(--panel2)}
  .ev-row.now{background:var(--panel2);border-left:3px solid var(--accent);padding-left:5px}
  .ev-t{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted);min-width:46px}
  .ev-cat{font-size:10px;padding:1px 5px;border-radius:3px;font-weight:600;white-space:nowrap}
  .cat-war{background:#d93b3b24;color:var(--war)}
  .cat-peace,.cat-diplomacy{background:#1d8a5e24;color:var(--good)}
  .cat-capture,.cat-combat{background:#c97b1624;color:var(--warn)}
  .cat-tech{background:#0b7da124;color:var(--accent)}
  .cat-finance,.cat-milestone{background:#7e57c224;color:#8e68d4}
  .cat-fault{background:#d93b3b38;color:var(--war)}

  #controls{position:fixed;bottom:0;left:0;right:0;z-index:20;border-top:1px solid var(--border);background:var(--panel);padding:10px 20px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(0,0,0,.06)}
  #controls .row{max-width:1640px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  #play,#b1,#f1,#b10,#f10,#end{width:36px;padding:4px;font-size:15px}
  #play{color:var(--accent);font-weight:700}
  input[type=range]{flex:1;width:100%;min-width:0;accent-color:var(--accent);height:22px;cursor:pointer}
  #clock{margin-left:auto;font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted)}

  @media(max-width:1180px){main{grid-template-columns:1fr}}
  @media(max-width:700px){#wrap{padding:12px 10px 160px}#theme{margin-left:0}#clock{width:100%;margin-left:0}}
</style>
</head>
<body>
<div id="wrap">
  <header id="top">
    <h1>裂陆纪元 · 回放</h1>
    <span class="tag" id="tSeed">seed –</span>
    <span class="tag hi" id="tClock">tick –</span>
    <span class="tag hi" id="tWinner">胜者 –</span>
    <span class="tag" id="tEngine">–</span>
    <button id="openFile" type="button">打开回放</button>
    <select id="theme" aria-label="主题">
      <option value="light">亮色</option>
      <option value="dark">暗色</option>
      <option value="system">跟随系统</option>
    </select>
  </header>

  <div id="drop">
    把回放 JSON（<code>afb-rift-era-replay/1</code>）拖到这里，或
    <label style="cursor:pointer;text-decoration:underline;color:var(--accent)">
      选择文件<input id="file" type="file" accept=".json,application/json" hidden>
    </label>
    <div id="loadbox" role="status">支持完全离线本地回放（无外部网络请求）</div>
    <div id="err"></div>
  </div>

  <main id="main" hidden>
    <div class="col">
      <div class="card">
        <div class="card-hd">
          <h2>512×512 世界地图 <span class="sub" id="mapInfo"></span></h2>
          <div class="toggles">
            <button id="tgTerr" class="on" type="button">疆域</button>
            <button id="tgSea" class="on" type="button">海/河/空</button>
            <button id="tgRoad" type="button">陆/铁</button>
            <button id="tgWar" class="on" type="button">战线</button>
            <button id="btnClearSel" type="button" hidden>清除高亮</button>
          </div>
        </div>
        <div class="map-wrap">
          <canvas id="cvMap" width="1024" height="1024"></canvas>
        </div>
        <div class="map-legend">
          <span><i class="sw" style="background:var(--ocean)"></i>海洋</span>
          <span><i class="sw" style="background:var(--plain)"></i>平原</span>
          <span><i class="sw" style="background:var(--forest)"></i>森林</span>
          <span><i class="sw" style="background:var(--hill)"></i>丘陵</span>
          <span><i class="sw" style="background:var(--desert)"></i>荒漠</span>
          <span><i class="sw" style="background:var(--mountain)"></i>山地</span>
          <span>★ 首都</span>
          <span>◆ 城邦</span>
          <span style="margin-left:auto">悬停查看枢纽 · 点击高亮国家</span>
        </div>
      </div>

      <div class="card">
        <div class="card-hd">
          <h2>外交与战略事件流 <span class="sub" id="evCount"></span></h2>
          <div class="ev-filters" id="evFilters">
            <button data-f="all" class="on" type="button">全部</button>
            <button data-f="diplo" type="button">战争/外交</button>
            <button data-f="military" type="button">占领/战斗</button>
            <button data-f="tech" type="button">科研</button>
            <button data-f="econ" type="button">金融/里程碑</button>
            <button data-f="fault" type="button">故障</button>
          </div>
        </div>
        <div id="warsBar">当前无交战</div>
        <div id="evList"></div>
      </div>
    </div>

    <div class="col">
      <div class="card">
        <div class="card-hd">
          <h2>八国国力实时榜 <span class="sub" id="lbHint">点击任意行高亮对应国家</span></h2>
        </div>
        <div class="tbl-wrap">
          <table class="lb">
            <thead>
              <tr>
                <th>#</th>
                <th>国家 / 策略</th>
                <th>实时 U</th>
                <th>终局 V</th>
                <th>资金(RU)</th>
                <th>工业 VA</th>
                <th>供电</th>
                <th>人口</th>
                <th>枢纽/区</th>
                <th>军力</th>
                <th>科技</th>
                <th>故障</th>
              </tr>
            </thead>
            <tbody id="lbBody"></tbody>
          </table>
        </div>
        <div class="pillars-box" id="pillarsBox"></div>
      </div>

      <div class="card">
        <div class="card-hd">
          <h2>宏观轨迹曲线 <span class="sub" id="chartHint">点击图表可跳转进度</span></h2>
          <div class="chart-tabs" id="chartTabs">
            <button data-m="score" class="on" type="button">实时国力 U</button>
            <button data-m="cash" type="button">资金 Cash</button>
            <button data-m="gdp" type="button">工业 VA</button>
            <button data-m="pop" type="button">人口</button>
            <button data-m="cities" type="button">枢纽数</button>
            <button data-m="mil_power" type="button">军力</button>
            <button data-m="techs" type="button">科技</button>
            <button data-m="final_v" type="button">终局 V 对比</button>
          </div>
        </div>
        <canvas id="cvChart" width="900" height="320"></canvas>
      </div>
    </div>
  </main>

  <div id="controls" hidden>
    <div class="row" style="margin-bottom:6px">
      <button id="play" title="播放/暂停 (Space)" aria-label="播放">▶</button>
      <select id="spd" aria-label="播放速度">
        <option value="1">1×</option>
        <option value="2">2×</option>
        <option value="4" selected>4×</option>
        <option value="8">8×</option>
        <option value="16">16×</option>
      </select>
      <button id="b10" title="后退 10 帧 (Shift+←)" aria-label="后退 10 帧">↤</button>
      <button id="b1" title="上一帧 (←)" aria-label="上一帧">←</button>
      <button id="f1" title="下一帧 (→)" aria-label="下一帧">→</button>
      <button id="f10" title="前进 10 帧 (Shift+→)" aria-label="前进 10 帧">↦</button>
      <button id="end" title="跳到终局" aria-label="跳到终局">⇥</button>
      <span id="clock">–</span>
    </div>
    <div class="row">
      <input id="seek" aria-label="回放进度" type="range" min="0" max="0" value="0" step="1">
    </div>
  </div>
</div>
<div id="tip" hidden></div>

<script>
"use strict";
var OWNERS = ["n0","n1","n2","n3","n4","n5","n6","n7"];
var PALETTE = {
  n0:"#0b84a5", n1:"#e05a47", n2:"#2d9f5c", n3:"#d98a16",
  n4:"#8854d0", n5:"#d64991", n6:"#3b6be0", n7:"#00a39b"
};
var PILLAR_NAMES = ["人口","工业","控制","科技","国际"];
var PILLAR_COLORS = ["#2d9f5c","#0b84a5","#d98a16","#8854d0","#d64991"];
var METRIC_TITLES = {
  score:"实时国力 U", cash:"总资金账面 (RU)", gdp:"工业增加值 (VA)",
  pop:"受控平民人口", cities:"受控枢纽数", mil_power:"军事实力",
  techs:"已解锁科技数", final_v:"终局精确国力 V 对比"
};

var S = {
  rep:null, frames:[], idx:0, renderedIdx:-1, playing:false, speed:4,
  last:0, acc:0, raf:0, src:"", loadSeq:0,
  selected:null, metric:"score", evFilter:"all",
  opts:{terr:true, sea:true, road:false, war:true},
  terrainCanvas:null, regionSnapshots:[], cityOwnerSnapshots:[], cityPopSnapshots:[],
  allEvents:[], cityIndexById:{}, capitalsByOwner:{},
  hoverCity:null, chartMeta:null
};

function esc(v){
  return String(v===null||v===undefined?"":v).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function fmtNum(v, dec){
  if (v===null||v===undefined||isNaN(v)) return "–";
  var n = Number(v);
  if (Math.abs(n) >= 100000) return (n/1000).toFixed(1)+"k";
  return dec ? n.toFixed(dec) : Math.round(n).toLocaleString("en-US");
}
function nationColor(owner){
  return PALETTE[owner] || "#999999";
}
function hexAlpha(hex, alpha){
  var c = hex.replace("#","");
  var r = parseInt(c.slice(0,2),16), g = parseInt(c.slice(2,4),16), b = parseInt(c.slice(4,6),16);
  return "rgba("+r+","+g+","+b+","+alpha+")";
}
function indexAtTick(tick){
  var fs = S.frames;
  if (!fs.length) return 0;
  var lo = 0, hi = fs.length - 1;
  while (lo < hi){
    var mid = (lo + hi) >>> 1;
    if (fs[mid].tick < tick) lo = mid + 1; else hi = mid;
  }
  return lo;
}

/* ---------------- 数据解码：累加区域/城市控制权与事件索引 ---------------- */
function decodeState(rep){
  var map = rep.map || {}, cities = map.cities || [], regions = map.regions || [];
  S.cityIndexById = {};
  S.capitalsByOwner = {};
  var curCityOwner = {}, curCityPop = {}, curRegOwner = {};
  for (var i=0;i<cities.length;i++){
    var c = cities[i];
    S.cityIndexById[c.id] = i;
    curCityOwner[c.id] = c.owner || null;
    curCityPop[c.id] = Number(c.pop || 0);
    if (c.is_capital && c.sovereign) S.capitalsByOwner[c.sovereign] = c;
  }
  for (var r=0;r<regions.length;r++){
    curRegOwner[regions[r][0]] = regions[r][5] || null;
  }

  S.regionSnapshots = [];
  S.cityOwnerSnapshots = [];
  S.cityPopSnapshots = [];
  S.allEvents = [];
  var frames = rep.frames || [];
  for (var fi=0;fi<frames.length;fi++){
    var f = frames[fi];
    var rdiff = f.region_owners || {};
    for (var rk in rdiff) curRegOwner[rk] = rdiff[rk];
    var cdiff = f.city_owners || {};
    for (var ck in cdiff) curCityOwner[ck] = cdiff[ck];
    var pdiff = f.city_pops || {};
    for (var pk in pdiff) curCityPop[pk] = pdiff[pk];

    S.regionSnapshots.push(Object.assign({}, curRegOwner));
    S.cityOwnerSnapshots.push(Object.assign({}, curCityOwner));
    S.cityPopSnapshots.push(Object.assign({}, curCityPop));

    var evs = f.events || [];
    for (var ei=0;ei<evs.length;ei++){
      S.allEvents.push(Object.assign({frameIdx:fi}, evs[ei]));
    }
  }
}

/* ---------------- 512x512 地图离线栅格与渲染 ---------------- */
function buildTerrainCache(){
  if (!S.rep || !S.rep.map) return;
  var map = S.rep.map, gw = map.grid_w || 64, gh = map.grid_h || 64, terr = map.terrain || "";
  var css = getComputedStyle(document.documentElement);
  var colors = [
    css.getPropertyValue("--ocean").trim(),
    css.getPropertyValue("--plain").trim(),
    css.getPropertyValue("--hill").trim(),
    css.getPropertyValue("--forest").trim(),
    css.getPropertyValue("--desert").trim(),
    css.getPropertyValue("--mountain").trim()
  ];
  var off = document.createElement("canvas");
  off.width = 512; off.height = 512;
  var ctx = off.getContext("2d");
  var cw = 512 / gw, ch = 512 / gh;
  for (var y=0;y<gh;y++){
    for (var x=0;x<gw;x++){
      var code = terr.charCodeAt(y*gw + x) - 48;
      ctx.fillStyle = colors[code] || colors[1];
      ctx.fillRect(x*cw, y*ch, Math.ceil(cw), Math.ceil(ch));
    }
  }
  S.terrainCanvas = off;
}

function drawStar(ctx, cx, cy, spikes, outerR, innerR){
  var rot = Math.PI / 2 * 3, step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outerR);
  for (var i=0;i<spikes;i++){
    ctx.lineTo(cx + Math.cos(rot)*outerR, cy + Math.sin(rot)*outerR);
    rot += step;
    ctx.lineTo(cx + Math.cos(rot)*innerR, cy + Math.sin(rot)*innerR);
    rot += step;
  }
  ctx.closePath();
}

function paintMap(){
  if (!S.rep || !S.frames.length) return;
  var cv = document.getElementById("cvMap"), ctx = cv.getContext("2d");
  var W = cv.width, H = cv.height, sx = W / 512, sy = H / 512;
  var map = S.rep.map, f = S.frames[S.idx];
  var regOwners = S.regionSnapshots[S.idx] || {};
  var cityOwners = S.cityOwnerSnapshots[S.idx] || {};
  var css = getComputedStyle(document.documentElement);
  var isDark = document.documentElement.getAttribute("data-theme") === "dark";

  ctx.clearRect(0, 0, W, H);
  if (S.terrainCanvas){
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(S.terrainCanvas, 0, 0, W, H);
  }

  // 1) Region territorial control overlay (24x20 grid)
  if (S.opts.terr && map.regions){
    var rows = map.rows || 20, cols = map.cols || 24;
    var rw = W / cols, rh = H / rows;
    for (var i=0;i<map.regions.length;i++){
      var r = map.regions[i];
      var rid = r[0], row = r[1], col = r[2], terrCode = r[4];
      if (terrCode === 0) continue;
      var ctrl = regOwners[rid];
      if (!ctrl) continue;
      if (PALETTE[ctrl]){
        var isSel = S.selected && S.selected === ctrl;
        var alpha = S.selected ? (isSel ? 0.42 : 0.12) : 0.28;
        ctx.fillStyle = hexAlpha(PALETTE[ctrl], alpha);
        ctx.fillRect(col*rw, row*rh, rw + 0.5, rh + 0.5);
        if (isSel){
          ctx.strokeStyle = hexAlpha(PALETTE[ctrl], 0.8);
          ctx.lineWidth = 1.5;
          ctx.strokeRect(col*rw + 0.75, row*rh + 0.75, rw - 1.5, rh - 1.5);
        }
      } else if (String(ctrl).indexOf("city-") === 0){
        ctx.fillStyle = isDark ? "rgba(229,185,76,0.16)" : "rgba(212,155,36,0.18)";
        ctx.fillRect(col*rw, row*rh, rw + 0.5, rh + 0.5);
      }
    }
  }

  // 2) Corridors (sea, river, air, road, rail)
  var cities = map.cities || [], corridors = map.corridors || [];
  if (S.opts.road || S.opts.sea){
    for (var ci=0;ci<corridors.length;ci++){
      var e = corridors[ci], mode = e[2];
      var a = cities[e[0]], b = cities[e[1]];
      if (!a || !b) continue;
      if (mode === "r"){
        if (!S.opts.road) continue;
        ctx.strokeStyle = isDark ? "rgba(200,215,225,0.16)" : "rgba(40,60,70,0.16)";
        ctx.lineWidth = 1;
        ctx.setLineDash([]);
      } else if (mode === "l"){
        if (!S.opts.road) continue;
        ctx.strokeStyle = isDark ? "rgba(225,180,105,0.48)" : "rgba(145,95,35,0.46)";
        ctx.lineWidth = 1.4;
        ctx.setLineDash([4,2]);
      } else if (mode === "s"){
        if (!S.opts.sea) continue;
        ctx.strokeStyle = isDark ? "rgba(95,180,245,0.45)" : "rgba(20,105,175,0.42)";
        ctx.lineWidth = 1.4;
        ctx.setLineDash([5,4]);
      } else if (mode === "v"){
        if (!S.opts.sea) continue;
        ctx.strokeStyle = isDark ? "rgba(70,210,200,0.45)" : "rgba(18,145,155,0.42)";
        ctx.lineWidth = 1.3;
        ctx.setLineDash([]);
      } else if (mode === "a"){
        if (!S.opts.sea) continue;
        ctx.strokeStyle = isDark ? "rgba(175,140,250,0.46)" : "rgba(110,70,195,0.42)";
        ctx.lineWidth = 1.2;
        ctx.setLineDash([2,4]);
      } else {
        continue;
      }
      ctx.beginPath();
      ctx.moveTo(a.x * sx, a.y * sy);
      ctx.lineTo(b.x * sx, b.y * sy);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // 3) Active war conflict lines between warring capitals
  var wars = f.wars || [];
  if (S.opts.war && wars.length){
    ctx.save();
    ctx.strokeStyle = css.getPropertyValue("--war").trim();
    ctx.lineWidth = 3;
    ctx.setLineDash([8,6]);
    for (var wi=0;wi<wars.length;wi++){
      var wa = S.capitalsByOwner[wars[wi][0]], wb = S.capitalsByOwner[wars[wi][1]];
      if (!wa || !wb) continue;
      ctx.beginPath();
      ctx.moveTo(wa.x * sx, wa.y * sy);
      ctx.lineTo(wb.x * sx, wb.y * sy);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 4) Cities & Hubs
  for (var hi=0;hi<cities.length;hi++){
    var hub = cities[hi];
    var owner = cityOwners[hub.id] || null;
    var hx = hub.x * sx, hy = hub.y * sy;
    var dimmed = S.selected && owner !== S.selected;

    if (hub.is_capital){
      var col = PALETTE[owner] || "#999";
      ctx.save();
      ctx.globalAlpha = dimmed ? 0.35 : 1.0;
      ctx.beginPath();
      ctx.arc(hx, hy, S.selected === owner ? 15 : 12, 0, Math.PI*2);
      ctx.fillStyle = isDark ? "#0f1519" : "#ffffff";
      ctx.fill();
      ctx.lineWidth = S.selected === owner ? 3.5 : 2.5;
      ctx.strokeStyle = col;
      ctx.stroke();

      drawStar(ctx, hx, hy, 5, 8.5, 4);
      ctx.fillStyle = col;
      ctx.fill();

      ctx.font = "bold 12px ui-monospace,Consolas,sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = isDark ? "#f2f7fa" : "#111e24";
      ctx.fillText(hub.sovereign || owner || hub.id, hx, hy - 15);
      ctx.restore();
    } else if (hub.is_core){
      ctx.save();
      ctx.globalAlpha = dimmed ? 0.25 : 0.95;
      ctx.beginPath();
      ctx.arc(hx, hy, 5.2, 0, Math.PI*2);
      ctx.fillStyle = PALETTE[owner] || "#7f8c8d";
      ctx.fill();
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = isDark ? "#111" : "#fff";
      ctx.stroke();
      ctx.restore();
    } else if (hub.is_city_state){
      ctx.save();
      ctx.globalAlpha = dimmed ? 0.25 : 0.9;
      ctx.translate(hx, hy);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = PALETTE[owner] || css.getPropertyValue("--city").trim();
      ctx.fillRect(-3.6, -3.6, 7.2, 7.2);
      ctx.strokeStyle = isDark ? "#111" : "#fff";
      ctx.lineWidth = 1;
      ctx.strokeRect(-3.6, -3.6, 7.2, 7.2);
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = dimmed ? 0.15 : 0.65;
      ctx.beginPath();
      ctx.arc(hx, hy, 2.6, 0, Math.PI*2);
      ctx.fillStyle = PALETTE[owner] || (isDark ? "#9eb0ba" : "#4b5e68");
      ctx.fill();
      ctx.restore();
    }
  }

  // 5) Hover highlight ring
  if (S.hoverCity){
    ctx.save();
    ctx.beginPath();
    ctx.arc(S.hoverCity.x * sx, S.hoverCity.y * sy, 14, 0, Math.PI*2);
    ctx.strokeStyle = css.getPropertyValue("--accent").trim();
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.restore();
  }
}

/* ---------------- 八国实时榜 + 五支柱拆解 ---------------- */
function paintLeaderboard(){
  var f = S.frames[S.idx], meta = S.rep.meta || {}, finalN = meta.nations || {};
  var isFinal = (S.idx === S.frames.length - 1);
  var rows = OWNERS.map(function(owner){
    var m = f.nations[owner] || {};
    var fn = finalN[owner] || {};
    var rankVal = isFinal ? Number(fn.V || 0) : (f.tick > 0 ? Number(m.score || 0) : Number(m.cash || 0));
    return {owner:owner, m:m, fn:fn, rankVal:rankVal};
  });
  rows.sort(function(a,b){ return b.rankVal - a.rankVal || a.owner.localeCompare(b.owner); });

  var html = "";
  for (var i=0;i<rows.length;i++){
    var r = rows[i], m = r.m, fn = r.fn, o = r.owner;
    var selCls = S.selected === o ? "sel" : "";
    var warHtml = (m.war_targets && m.war_targets.length)
      ? '<span class="war-badge" title="交战：'+esc(m.war_targets.join(", "))+'">⚔'+m.war_targets.length+"</span>" : "";
    var faultCls = (m.faults || 0) > 0 ? "fault-bad" : "";
    var pwrPct = Math.round((m.power_ratio !== undefined ? m.power_ratio : 1) * 100) + "%";
    html += '<tr class="'+selCls+'" data-owner="'+o+'">'
      + "<td>"+(i+1)+"</td>"
      + '<td><span class="dot" style="background:'+nationColor(o)+'"></span><span class="lbl">'+o+'</span>'
      + '<span class="botname">'+esc(fn.label || "")+"</span>"+warHtml+"</td>"
      + "<td>"+fmtNum(m.score, 2)+"</td>"
      + "<td>"+fmtNum(fn.V, 2)+"</td>"
      + "<td>"+fmtNum(m.cash, 0)+"</td>"
      + "<td>"+fmtNum(m.gdp, 2)+"</td>"
      + "<td>"+pwrPct+"</td>"
      + "<td>"+fmtNum(m.pop, 1)+"</td>"
      + "<td>"+(m.cities||0)+"/"+(m.regions||0)+"</td>"
      + "<td>"+fmtNum(m.mil_power, 1)+"</td>"
      + "<td>"+(m.techs||0)+"</td>"
      + '<td class="'+faultCls+'">'+(m.faults||0)+"</td>"
      + "</tr>";
  }
  var tbody = document.getElementById("lbBody");
  tbody.innerHTML = html;
  var trs = tbody.querySelectorAll("tr");
  for (var t=0;t<trs.length;t++){
    trs[t].addEventListener("click", function(){
      var o = this.getAttribute("data-owner");
      setSelected(S.selected === o ? null : o);
    });
  }

  // 5-pillar mini breakdown for selected or #1 nation (diverging track when any pillar < 0)
  var focusOwner = S.selected || rows[0].owner;
  var fm = f.nations[focusOwner] || {};
  var pillars = fm.pillars || [0,0,0,0,0];
  var maxP = Math.max(1, Math.max.apply(null, pillars.map(function(x){ return Math.abs(x); })));
  var hasNeg = pillars.some(function(x){ return Number(x || 0) < 0; });
  var phtml = '<strong><span class="dot" style="background:'+nationColor(focusOwner)+'"></span>'
    + focusOwner + " 五支柱</strong>";
  for (var pi=0;pi<5;pi++){
    var val = Number(pillars[pi] || 0);
    var isNeg = val < 0;
    var barStyle;
    if (hasNeg){
      var halfPct = Math.max(0, Math.min(50, Math.abs(val) / maxP * 50));
      barStyle = isNeg
        ? "left:"+(50 - halfPct).toFixed(1)+"%;width:"+halfPct.toFixed(1)+"%;background:var(--war)"
        : "left:50%;width:"+halfPct.toFixed(1)+"%;background:"+PILLAR_COLORS[pi];
    } else {
      var pct = Math.max(0, Math.min(100, Math.abs(val) / maxP * 100));
      barStyle = "left:0;width:"+pct.toFixed(1)+"%;background:"+PILLAR_COLORS[pi];
    }
    phtml += '<div class="pbar"><span>'+PILLAR_NAMES[pi]+'</span>'
      + '<div class="pbar-track">'+(hasNeg ? '<div class="pbar-zero"></div>' : '')
      + '<div class="pbar-fill" style="'+barStyle+'"></div></div>'
      + '<span class="'+(isNeg ? 'pbar-neg-val' : '')+'" style="font-family:ui-monospace,Consolas,monospace">'+val.toFixed(1)+"</span></div>";
  }
  document.getElementById("pillarsBox").innerHTML = phtml;
}

/* ---------------- 多系列折线图 & 终局 V 对比柱状图 ---------------- */
function paintChart(){
  if (!S.rep || !S.frames.length) return;
  var cv = document.getElementById("cvChart");
  var ratio = window.devicePixelRatio || 1;
  var W = Math.max(260, Math.round(cv.clientWidth * ratio));
  var H = Math.max(160, Math.round(cv.clientHeight * ratio));
  if (cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; }
  var ctx = cv.getContext("2d");
  var css = getComputedStyle(document.documentElement);
  ctx.fillStyle = css.getPropertyValue("--panel").trim();
  ctx.fillRect(0, 0, W, H);

  if (S.metric === "final_v"){
    paintFinalVBar(ctx, W, H, ratio, css);
    S.chartMeta = null;
    return;
  }

  var fs = S.frames, mkey = S.metric;
  var minV = Infinity, maxV = -Infinity;
  for (var i=0;i<fs.length;i++){
    var nat = fs[i].nations;
    for (var oi=0;oi<OWNERS.length;oi++){
      var v = Number((nat[OWNERS[oi]]||{})[mkey] || 0);
      if (v < minV) minV = v;
      if (v > maxV) maxV = v;
    }
  }
  if (!isFinite(minV)){ minV = 0; maxV = 1; }
  if (minV === maxV){ minV -= 1; maxV += 1; }
  var pad = (maxV - minV) * 0.08;
  minV -= pad; maxV += pad;

  var left = 54*ratio, right = W - 14*ratio, top = 16*ratio, bottom = H - 28*ratio;
  var t0 = fs[0].tick, t1 = Math.max(t0 + 1, fs[fs.length-1].tick);
  S.chartMeta = {left:left, right:right, t0:t0, t1:t1, ratio:ratio};

  // Grid & Y labels
  ctx.strokeStyle = css.getPropertyValue("--grid").trim();
  ctx.fillStyle = css.getPropertyValue("--muted").trim();
  ctx.font = (10*ratio) + "px ui-monospace,Consolas,sans-serif";
  ctx.lineWidth = ratio;
  for (var g=0;g<=4;g++){
    var gy = top + (bottom - top) * g / 4;
    ctx.beginPath(); ctx.moveTo(left, gy); ctx.lineTo(right, gy); ctx.stroke();
    var gv = maxV - (maxV - minV) * g / 4;
    ctx.textAlign = "right";
    ctx.fillText(fmtNum(gv, Math.abs(gv) < 100 ? 1 : 0), left - 6*ratio, gy + 3*ratio);
  }

  // Epoch markers (vertical subtle dashed lines at 25%, 50%, 75%)
  ctx.save();
  ctx.setLineDash([3*ratio, 4*ratio]);
  ctx.strokeStyle = css.getPropertyValue("--border").trim();
  for (var ep=1;ep<=3;ep++){
    var ex = left + (right - left) * (ep / 4);
    ctx.beginPath(); ctx.moveTo(ex, top); ctx.lineTo(ex, bottom); ctx.stroke();
  }
  ctx.restore();

  // Series lines (draw unselected first, selected last on top)
  var order = OWNERS.slice();
  if (S.selected){
    order = order.filter(function(o){ return o !== S.selected; });
    order.push(S.selected);
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(left, top, right-left, bottom-top); ctx.clip();
  for (var si=0;si<order.length;si++){
    var owner = order[si];
    var isSel = S.selected === owner;
    ctx.strokeStyle = nationColor(owner);
    ctx.globalAlpha = S.selected ? (isSel ? 1.0 : 0.25) : 0.9;
    ctx.lineWidth = (isSel ? 3 : 1.7) * ratio;
    ctx.beginPath();
    for (var fi=0;fi<fs.length;fi++){
      var x = left + (right - left) * (fs[fi].tick - t0) / (t1 - t0);
      var val = Number((fs[fi].nations[owner]||{})[mkey] || 0);
      var y = bottom - (bottom - top) * (val - minV) / (maxV - minV);
      if (fi === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.restore();

  // Active tick cursor
  var curT = fs[S.idx].tick;
  var cx = left + (right - left) * (curT - t0) / (t1 - t0);
  ctx.strokeStyle = css.getPropertyValue("--marker").trim();
  ctx.lineWidth = 1.5 * ratio;
  ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx, bottom); ctx.stroke();

  // Active dots
  for (var di=0;di<OWNERS.length;di++){
    var o = OWNERS[di];
    if (S.selected && S.selected !== o) continue;
    var dv = Number((fs[S.idx].nations[o]||{})[mkey] || 0);
    var dy = bottom - (bottom - top) * (dv - minV) / (maxV - minV);
    ctx.beginPath();
    ctx.arc(cx, dy, (S.selected===o ? 4 : 2.8)*ratio, 0, Math.PI*2);
    ctx.fillStyle = nationColor(o);
    ctx.fill();
  }

  ctx.fillStyle = css.getPropertyValue("--muted").trim();
  ctx.textAlign = "left";
  ctx.fillText((METRIC_TITLES[mkey]||mkey) + "  ·  tick " + curT, left, H - 8*ratio);
}

function paintFinalVBar(ctx, W, H, ratio, css){
  var meta = S.rep.meta || {}, finalN = meta.nations || {};
  var rows = OWNERS.map(function(o){
    var fn = finalN[o] || {};
    return {owner:o, label:fn.label || o, v:Number(fn.V || 0)};
  });
  rows.sort(function(a,b){ return b.v - a.v; });
  var minV = Math.min(0, rows[rows.length-1].v);
  var maxV = Math.max(1, rows[0].v);
  var span = Math.max(1e-6, maxV - minV);

  var left = 110*ratio, right = W - 64*ratio, top = 12*ratio, bottom = H - 14*ratio;
  var rowH = (bottom - top) / rows.length;
  var zeroX = left + (right - left) * (0 - minV) / span;

  ctx.strokeStyle = css.getPropertyValue("--grid").trim();
  ctx.lineWidth = ratio;
  ctx.beginPath(); ctx.moveTo(zeroX, top); ctx.lineTo(zeroX, bottom); ctx.stroke();

  ctx.font = (11*ratio) + "px ui-monospace,Consolas,sans-serif";
  for (var i=0;i<rows.length;i++){
    var r = rows[i], y = top + i * rowH + rowH * 0.18, bh = rowH * 0.64;
    var vx = left + (right - left) * (r.v - minV) / span;
    var bx = Math.min(zeroX, vx), bw = Math.max(2*ratio, Math.abs(vx - zeroX));
    ctx.fillStyle = nationColor(r.owner);
    ctx.globalAlpha = S.selected && S.selected !== r.owner ? 0.3 : 0.92;
    ctx.fillRect(bx, y, bw, bh);
    ctx.globalAlpha = 1;

    ctx.fillStyle = css.getPropertyValue("--text").trim();
    ctx.textAlign = "right";
    var prefix = r.owner === meta.winner ? "★ " : "";
    ctx.fillText(prefix + r.owner + " " + String(r.label).slice(0,8), left - 8*ratio, y + bh*0.72);
    ctx.textAlign = "left";
    ctx.fillText(r.v.toFixed(3), Math.max(vx, zeroX) + 6*ratio, y + bh*0.72);
  }
}

/* ---------------- 外交与战略事件流 ---------------- */
function matchesFilter(ev){
  var flt = S.evFilter;
  if (flt === "all") return true;
  if (flt === "diplo") return ev.type === "war" || ev.type === "peace" || ev.type === "diplomacy";
  if (flt === "military") return ev.type === "capture" || ev.type === "combat";
  if (flt === "tech") return ev.type === "tech";
  if (flt === "econ") return ev.type === "finance" || ev.type === "milestone";
  if (flt === "fault") return ev.type === "fault";
  return true;
}

function paintEvents(){
  var f = S.frames[S.idx], curT = f.tick;
  var wars = f.wars || [];
  var totalWinOrders = 0;
  for (var i=0;i<OWNERS.length;i++) totalWinOrders += Number((f.nations[OWNERS[i]]||{}).window_orders || 0);
  var wb = document.getElementById("warsBar");
  if (wars.length){
    wb.innerHTML = '<strong style="color:var(--war)">⚔ 当前交战：</strong>'
      + wars.map(function(w){ return esc(w[0])+" vs "+esc(w[1]); }).join(" · ")
      + " &nbsp;|&nbsp; 本采样段累计指令：" + totalWinOrders;
  } else {
    wb.textContent = "和平状态（当前无交战） · 本采样段累计指令：" + totalWinOrders;
  }

  var filtered = S.allEvents.filter(function(ev){
    if (!matchesFilter(ev)) return false;
    if (S.selected && ev.actor !== S.selected && ev.target !== S.selected) return false;
    return ev.tick <= curT;
  });
  document.getElementById("evCount").textContent = "共 " + filtered.length + " 条（截至 tick " + curT + "）";

  var el = document.getElementById("evList");
  if (!filtered.length){
    el.innerHTML = '<div style="padding:12px;color:var(--muted);text-align:center">截至当前帧暂无匹配事件</div>';
    return;
  }
  var start = Math.max(0, filtered.length - 80);
  var html = "";
  for (var j=filtered.length - 1; j>=start; j--){
    var ev = filtered[j];
    var isNow = ev.frameIdx === S.idx;
    html += '<div class="ev-row'+(isNow?" now":"")+'" data-fi="'+ev.frameIdx+'">'
      + '<span class="ev-t">t='+ev.tick+"</span>"
      + '<span class="ev-cat cat-'+esc(ev.type)+'">'+esc(ev.type)+"</span>"
      + "<span>"+esc(ev.detail)+"</span>"
      + "</div>";
  }
  el.innerHTML = html;
  var items = el.querySelectorAll(".ev-row");
  for (var k=0;k<items.length;k++){
    items[k].addEventListener("click", function(){
      setPlaying(false);
      S.idx = Number(this.getAttribute("data-fi")) || 0;
      render(true);
    });
  }
}

/* ---------------- 主渲染与播放控制 ---------------- */
function setSelected(owner){
  S.selected = owner;
  document.getElementById("btnClearSel").hidden = !owner;
  paintMap(); paintLeaderboard(); paintChart(); paintEvents();
}

function render(force){
  if (!S.frames.length) return;
  S.idx = Math.max(0, Math.min(S.idx, S.frames.length - 1));
  if (!force && S.renderedIdx === S.idx) return;
  S.renderedIdx = S.idx;
  var f = S.frames[S.idx], meta = S.rep.meta || {};
  document.getElementById("tClock").textContent =
    "tick "+f.tick+"/"+meta.ticks+" · 周期 "+f.cycle+" · 第 "+f.epoch+" 纪元";
  document.getElementById("clock").textContent =
    "帧 "+(S.idx+1)+"/"+S.frames.length+" · tick "+f.tick+" · 周期 "+f.cycle+" · 纪元 "+f.epoch;
  document.getElementById("seek").value = String(S.idx);

  var params = new URLSearchParams(location.hash.slice(1));
  if (S.src) params.set("src", S.src); else params.delete("src");
  params.set("t", String(f.tick));
  var hash = "#" + params.toString();
  if (history.replaceState && hash !== location.hash){
    try { history.replaceState(null, "", hash); } catch(_e){}
  }
  paintMap(); paintLeaderboard(); paintChart(); paintEvents();
}

function stepAnim(ts){
  if (!S.playing) return;
  if (!S.last) S.last = ts;
  var dt = Math.min(0.25, (ts - S.last) / 1000);
  S.last = ts;
  S.acc += dt * S.speed * 2.5;
  var before = S.idx;
  while (S.acc >= 1 && S.idx < S.frames.length - 1){
    S.acc -= 1;
    S.idx++;
  }
  if (before !== S.idx) render();
  if (S.idx >= S.frames.length - 1) setPlaying(false);
  if (S.playing) S.raf = requestAnimationFrame(stepAnim);
}

function setPlaying(on){
  if (on && !S.frames.length) return;
  if (S.playing === on) return;
  S.playing = on; S.last = 0; S.acc = 0;
  cancelAnimationFrame(S.raf);
  var btn = document.getElementById("play");
  btn.textContent = on ? "⏸" : "▶";
  btn.title = on ? "暂停 (Space)" : "播放 (Space)";
  if (on){
    if (S.idx >= S.frames.length - 1){ S.idx = 0; render(true); }
    S.raf = requestAnimationFrame(stepAnim);
  }
}

/* ---------------- 载入回放 ---------------- */
function loadReplay(rep, options){
  options = options || {};
  if (!rep || !Array.isArray(rep.frames)) throw new Error("不是有效回放（缺少 frames）");
  if (String(rep.format || "").indexOf("afb-rift-era-replay") !== 0) throw new Error("格式不匹配：" + rep.format);
  if (!rep.frames.length) throw new Error("回放不含可播放帧");
  setPlaying(false);
  S.rep = rep; S.frames = rep.frames; S.idx = 0; S.renderedIdx = -1;
  S.src = options.src || ""; S.selected = null; S.hoverCity = null;
  document.getElementById("btnClearSel").hidden = true;
  decodeState(rep);
  buildTerrainCache();

  if (options.t !== null && options.t !== undefined) S.idx = indexAtTick(options.t);
  var meta = rep.meta || {}, win = meta.winner || "?", wn = (meta.nations || {})[win] || {};
  document.getElementById("tSeed").textContent = "seed " + meta.seed + (meta.legacy_map ? " (legacy)" : " (atlas)");
  document.getElementById("tWinner").textContent =
    "胜者 " + win + "(" + (meta.winner_label || "?") + ") V=" + fmtNum(wn.V, 3);
  document.getElementById("tEngine").textContent =
    (meta.rules_version || "rift_era") + " · 引擎 " + String(meta.engine_hash || "").slice(0,8)
    + " · 每 " + (meta.sample_every || 10) + " tick";
  document.getElementById("mapInfo").textContent =
    (rep.map.cities || []).length + " 枢纽 · " + (rep.map.corridors || []).length + " 走廊";

  document.getElementById("main").hidden = false;
  document.getElementById("controls").hidden = false;
  document.getElementById("drop").style.display = "none";
  document.getElementById("err").textContent = "";
  var seek = document.getElementById("seek");
  seek.max = String(S.frames.length - 1);
  seek.value = String(S.idx);
  render(true);
}

function fail(e){
  document.getElementById("drop").style.display = "block";
  document.getElementById("loadbox").textContent = "";
  document.getElementById("err").textContent = "载入失败：" + (e && e.message ? e.message : e);
}

function applyTheme(mode){
  var dark = mode === "dark" || (mode === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  try { localStorage.setItem("rift_era.theme", mode); } catch(_e){}
  if (S.rep){ buildTerrainCache(); paintMap(); paintChart(); }
}

/* ---------------- 交互绑定 ---------------- */
function bindMapEvents(){
  var cv = document.getElementById("cvMap"), tip = document.getElementById("tip");
  function findCity(ev){
    if (!S.rep || !S.rep.map) return null;
    var rect = cv.getBoundingClientRect();
    var mx = (ev.clientX - rect.left) / rect.width * 512;
    var my = (ev.clientY - rect.top) / rect.height * 512;
    var cities = S.rep.map.cities || [], best = null, bestD = 144;
    for (var i=0;i<cities.length;i++){
      var c = cities[i], dx = c.x - mx, dy = c.y - my, d2 = dx*dx + dy*dy;
      if (d2 < bestD){ bestD = d2; best = c; }
    }
    return best;
  }
  cv.addEventListener("mousemove", function(ev){
    var c = findCity(ev);
    if (c !== S.hoverCity){ S.hoverCity = c; paintMap(); }
    if (!c){ tip.hidden = true; return; }
    var owner = (S.cityOwnerSnapshots[S.idx] || {})[c.id] || "无主";
    var pop = (S.cityPopSnapshots[S.idx] || {})[c.id];
    var tags = [];
    if (c.is_capital) tags.push("首都");
    else if (c.is_core) tags.push("核心枢纽");
    if (c.is_city_state) tags.push("中立城邦");
    if (c.is_coastal) tags.push("沿海港口");
    tip.innerHTML = "<strong>"+esc(c.id)+"</strong>" + (tags.length ? " <span class='sub'>("+esc(tags.join("/"))+")</span>" : "")
      + "<br>控制方：<strong>"+esc(owner)+"</strong> · 原主权："+esc(c.sovereign || "无")
      + "<br>分区："+esc(c.region)+" · 坐标 ("+c.x+", "+c.y+")"
      + "<br>人口："+(pop !== undefined ? fmtNum(pop,1) : fmtNum(c.pop,1));
    tip.hidden = false;
    var tx = Math.min(window.innerWidth - 270, ev.clientX + 14);
    var ty = Math.min(window.innerHeight - 110, ev.clientY + 14);
    tip.style.left = Math.max(8, tx) + "px";
    tip.style.top = Math.max(8, ty) + "px";
  });
  cv.addEventListener("mouseleave", function(){
    tip.hidden = true;
    if (S.hoverCity){ S.hoverCity = null; paintMap(); }
  });
  cv.addEventListener("click", function(ev){
    var c = findCity(ev);
    if (!c) return;
    var owner = (S.cityOwnerSnapshots[S.idx] || {})[c.id];
    if (PALETTE[owner]) setSelected(S.selected === owner ? null : owner);
  });
}

function bindChartEvents(){
  var cv = document.getElementById("cvChart");
  cv.addEventListener("click", function(ev){
    if (!S.chartMeta || !S.frames.length) return;
    var rect = cv.getBoundingClientRect();
    var px = (ev.clientX - rect.left) * S.chartMeta.ratio;
    var frac = (px - S.chartMeta.left) / Math.max(1, S.chartMeta.right - S.chartMeta.left);
    frac = Math.max(0, Math.min(1, frac));
    var targetT = S.chartMeta.t0 + frac * (S.chartMeta.t1 - S.chartMeta.t0);
    setPlaying(false);
    S.idx = indexAtTick(targetT);
    render(true);
  });
}

function boot(){
  var theme = document.getElementById("theme"), saved;
  try { saved = localStorage.getItem("rift_era.theme"); } catch(_e){}
  theme.value = ["light","dark","system"].indexOf(saved) >= 0 ? saved : "light";
  applyTheme(theme.value);
  theme.addEventListener("change", function(){ applyTheme(theme.value); });
  if (window.matchMedia){
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", function(){ if (theme.value === "system") applyTheme("system"); });
  }

  var params = new URLSearchParams(location.hash.slice(1)), src = params.get("src"), t = params.get("t");
  var wantT = t !== null && /^\d+$/.test(t) ? Number(t) : null;
  if (src){
    var seq = ++S.loadSeq;
    document.getElementById("loadbox").textContent = "加载回放…";
    fetch(src).then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(rep){ if (seq === S.loadSeq) loadReplay(rep, {src:src, t:wantT}); })
      .catch(function(err){ if (seq === S.loadSeq) fail(err); });
  }

  function readFile(file){
    if (!file) return;
    var seq = ++S.loadSeq;
    setPlaying(false);
    var fr = new FileReader();
    fr.onload = function(){
      if (seq !== S.loadSeq) return;
      try { loadReplay(JSON.parse(fr.result), {src:""}); } catch(e){ fail(e); }
    };
    fr.onerror = function(){ if (seq === S.loadSeq) fail(new Error("无法读取文件")); };
    fr.readAsText(file);
  }
  document.getElementById("openFile").addEventListener("click", function(){ document.getElementById("file").click(); });
  document.getElementById("file").addEventListener("change", function(ev){ readFile(ev.target.files[0]); ev.target.value = ""; });
  var drop = document.getElementById("drop");
  ["dragenter","dragover"].forEach(function(ty){ drop.addEventListener(ty, function(e){ e.preventDefault(); drop.classList.add("hot"); }); });
  ["dragleave","drop"].forEach(function(ty){ drop.addEventListener(ty, function(e){ e.preventDefault(); drop.classList.remove("hot"); }); });
  drop.addEventListener("drop", function(e){ readFile(e.dataTransfer.files[0]); });

  function toggleOpt(id, key){
    var b = document.getElementById(id);
    b.addEventListener("click", function(){
      S.opts[key] = !S.opts[key];
      b.classList.toggle("on", S.opts[key]);
      paintMap();
    });
  }
  toggleOpt("tgTerr", "terr");
  toggleOpt("tgSea", "sea");
  toggleOpt("tgRoad", "road");
  toggleOpt("tgWar", "war");
  document.getElementById("btnClearSel").addEventListener("click", function(){ setSelected(null); });

  var tabs = document.getElementById("chartTabs").querySelectorAll("button");
  for (var ti=0;ti<tabs.length;ti++){
    tabs[ti].addEventListener("click", function(){
      for (var k=0;k<tabs.length;k++) tabs[k].classList.remove("on");
      this.classList.add("on");
      S.metric = this.getAttribute("data-m");
      paintChart();
    });
  }

  var fbtns = document.getElementById("evFilters").querySelectorAll("button");
  for (var fi=0;fi<fbtns.length;fi++){
    fbtns[fi].addEventListener("click", function(){
      for (var k=0;k<fbtns.length;k++) fbtns[k].classList.remove("on");
      this.classList.add("on");
      S.evFilter = this.getAttribute("data-f");
      paintEvents();
    });
  }

  document.getElementById("play").addEventListener("click", function(){ setPlaying(!S.playing); });
  document.getElementById("spd").addEventListener("change", function(ev){ S.speed = Number(ev.target.value) || 4; });
  function bump(delta){ setPlaying(false); S.idx += delta; render(); }
  document.getElementById("b1").addEventListener("click", function(){ bump(-1); });
  document.getElementById("f1").addEventListener("click", function(){ bump(1); });
  document.getElementById("b10").addEventListener("click", function(){ bump(-10); });
  document.getElementById("f10").addEventListener("click", function(){ bump(10); });
  document.getElementById("end").addEventListener("click", function(){ setPlaying(false); S.idx = S.frames.length - 1; render(); });
  document.getElementById("seek").addEventListener("input", function(ev){ setPlaying(false); S.idx = Number(ev.target.value) || 0; render(); });

  window.addEventListener("keydown", function(e){
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
    if (e.key === " "){ e.preventDefault(); setPlaying(!S.playing); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); bump(e.shiftKey ? 10 : 1); }
    else if (e.key === "ArrowLeft"){ e.preventDefault(); bump(e.shiftKey ? -10 : -1); }
    else if (e.key === "Escape" && S.selected){ setSelected(null); }
  });
  document.addEventListener("visibilitychange", function(){ S.last = 0; });
  if (window.ResizeObserver){
    var ro = new ResizeObserver(function(){ if (S.rep) paintChart(); });
    ro.observe(document.getElementById("cvChart"));
  } else {
    window.addEventListener("resize", function(){ if (S.rep) paintChart(); });
  }
  bindMapEvents();
  bindChartEvents();
}
boot();
</script>
</body>
</html>
